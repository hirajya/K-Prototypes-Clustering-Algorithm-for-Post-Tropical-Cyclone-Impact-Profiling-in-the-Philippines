[project]
name = "typhoon-impact-api"
version = "1.0.0"
description = "Typhoon Impact Clustering & Prediction API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.2",

    # NumPy 2.x compatible stack
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",

    "python-multipart>=0.0.6",
    "xgboost>=3.1.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
