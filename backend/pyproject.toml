[project]
name = "typhoon-impact-api"
version = "1.0.0"
description = "Typhoon Impact Clustering & Prediction API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",

    # NumPy 2.x compatible stack
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",

    # ML
    "xgboost>=2.1.0",

    # File uploads
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
